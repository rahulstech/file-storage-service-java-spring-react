spring.application.name=file-storage
spring.profiles.active=${SPRING_PROFILE:local}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:file_storage_db}?sslmode=${DB_SSL:disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

aws.s3.region=${AWS_S3_REGION:ap-south-1}
aws.s3.bucket=${AWS_S3_BUCKET}
aws.cdn.base_url=${AWS_CDN_BASE_URL}

filestorageservice.jwt.secret=${JWT_SECRET}
filestorageservice.cors.allow_origins=${CORS_ALLOW_ORIGINS:http://localhost:*}

# base path for management api endpoints, eg: health, info, metrics etc.
management.endpoints.web.base-path=/internal
